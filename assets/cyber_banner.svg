<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060b"/>
      <stop offset="40%" stop-color="#090d18"/>
      <stop offset="70%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#040509"/>
    </linearGradient>

    <!-- Neon Glow Gradients -->
    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <linearGradient id="neon-pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>

    <linearGradient id="laser-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff0055" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.5"/>
    </filter>

    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff0055" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff0055" flood-opacity="0.5"/>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.4"/>
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Pro Text', Consolas, monospace; }
    .chinese { font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; font-weight: 800; }
    .title-glitch { font-family: 'Impact', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: 7px; text-transform: uppercase; }
  </style>

  <!-- Background -->
  <rect width="1000" height="280" fill="url(#cyber-bg)" rx="12"/>
  <rect width="1000" height="280" fill="url(#cyber-grid)" rx="12"/>
  <rect width="1000" height="280" fill="url(#scanlines)" rx="12"/>

  <!-- Border & Frame HUD -->
  <rect x="12" y="12" width="976" height="256" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" rx="8"/>
  <rect x="16" y="16" width="968" height="248" fill="none" stroke="#ff0055" stroke-width="0.5" stroke-opacity="0.2" rx="6"/>

  <!-- Corner Brackets (HUD Tech) -->
  <!-- Top Left -->
  <path d="M 12 40 L 12 12 L 40 12" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)"/>
  <rect x="18" y="18" width="4" height="4" fill="#00f0ff"/>
  <!-- Top Right -->
  <path d="M 988 40 L 988 12 L 960 12" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)"/>
  <rect x="978" y="18" width="4" height="4" fill="#00f0ff"/>
  <!-- Bottom Left -->
  <path d="M 12 240 L 12 268 L 40 268" fill="none" stroke="#ff0055" stroke-width="3" filter="url(#glow-pink)"/>
  <rect x="18" y="258" width="4" height="4" fill="#ff0055"/>
  <!-- Bottom Right -->
  <path d="M 988 240 L 988 268 L 960 268" fill="none" stroke="#ff0055" stroke-width="3" filter="url(#glow-pink)"/>
  <rect x="978" y="258" width="4" height="4" fill="#ff0055"/>

  <!-- Top System Telemetry Bar -->
  <text x="35" y="34" class="mono" font-size="11" fill="#00f0ff" opacity="0.8" letter-spacing="1">
    SYS_ID: 0x73F7 // LOC: 31°13'N 121°28'E [NEO-SHANGHAI GRID] // STATUS: UNRESTRICTED
  </text>
  <text x="965" y="34" text-anchor="end" class="mono" font-size="11" fill="#ff0055" opacity="0.9" letter-spacing="1">
    SEC_LVL: 9 // CIPHER: QUANTUM-AES256
  </text>
  <line x1="35" y1="42" x2="965" y2="42" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Left Side: Chinese Neon Vertical Signs -->
  <g transform="translate(48, 70)">
    <!-- Neon Sign Box 1 -->
    <rect x="-8" y="0" width="34" height="110" fill="#ff0055" fill-opacity="0.07" stroke="#ff0055" stroke-opacity="0.4" rx="4"/>
    <text x="9" y="24" class="chinese" font-size="18" fill="#ff0055" filter="url(#glow-pink)" text-anchor="middle">赛</text>
    <text x="9" y="50" class="chinese" font-size="18" fill="#ff0055" filter="url(#glow-pink)" text-anchor="middle">博</text>
    <text x="9" y="76" class="chinese" font-size="18" fill="#ff0055" filter="url(#glow-pink)" text-anchor="middle">朋</text>
    <text x="9" y="102" class="chinese" font-size="18" fill="#ff0055" filter="url(#glow-pink)" text-anchor="middle">克</text>
  </g>

  <g transform="translate(90, 70)">
    <!-- Neon Sign Box 2 -->
    <rect x="-8" y="0" width="34" height="110" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.4" rx="4"/>
    <text x="9" y="24" class="chinese" font-size="18" fill="#00f0ff" filter="url(#glow-cyan)" text-anchor="middle">幽</text>
    <text x="9" y="50" class="chinese" font-size="18" fill="#00f0ff" filter="url(#glow-cyan)" text-anchor="middle">灵</text>
    <text x="9" y="76" class="chinese" font-size="18" fill="#00f0ff" filter="url(#glow-cyan)" text-anchor="middle">协</text>
    <text x="9" y="102" class="chinese" font-size="18" fill="#00f0ff" filter="url(#glow-cyan)" text-anchor="middle">议</text>
  </g>

  <!-- Right Side: Chinese Neon Vertical Signs -->
  <g transform="translate(876, 70)">
    <!-- Neon Sign Box 3 -->
    <rect x="-8" y="0" width="34" height="110" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.4" rx="4"/>
    <text x="9" y="24" class="chinese" font-size="18" fill="#00f0ff" filter="url(#glow-cyan)" text-anchor="middle">未</text>
    <text x="9" y="50" class="chinese" font-size="18" fill="#00f0ff" filter="url(#glow-cyan)" text-anchor="middle">来</text>
    <text x="9" y="76" class="chinese" font-size="18" fill="#00f0ff" filter="url(#glow-cyan)" text-anchor="middle">终</text>
    <text x="9" y="102" class="chinese" font-size="18" fill="#00f0ff" filter="url(#glow-cyan)" text-anchor="middle">端</text>
  </g>

  <g transform="translate(918, 70)">
    <!-- Neon Sign Box 4 -->
    <rect x="-8" y="0" width="34" height="110" fill="#ff0055" fill-opacity="0.07" stroke="#ff0055" stroke-opacity="0.4" rx="4"/>
    <text x="9" y="24" class="chinese" font-size="18" fill="#ff0055" filter="url(#glow-pink)" text-anchor="middle">极</text>
    <text x="9" y="50" class="chinese" font-size="18" fill="#ff0055" filter="url(#glow-pink)" text-anchor="middle">客</text>
    <text x="9" y="76" class="chinese" font-size="18" fill="#ff0055" filter="url(#glow-pink)" text-anchor="middle">核</text>
    <text x="9" y="102" class="chinese" font-size="18" fill="#ff0055" filter="url(#glow-pink)" text-anchor="middle">心</text>
  </g>

  <!-- Centerpiece: Glitch & Neon Cyberpunk Logo -->
  <g transform="translate(500, 120)">
    <!-- Background Chromatic Aberration Shadows -->
    <text x="-3" y="1" class="title-glitch" font-size="64" fill="#ff0055" text-anchor="middle" opacity="0.85" filter="url(#glow-pink)">ALTZGAMERZ</text>
    <text x="3" y="-1" class="title-glitch" font-size="64" fill="#00f0ff" text-anchor="middle" opacity="0.85" filter="url(#glow-cyan)">ALTZGAMERZ</text>
    <!-- Foreground Pure Text -->
    <text x="0" y="0" class="title-glitch" font-size="64" fill="#ffffff" text-anchor="middle">ALTZGAMERZ</text>
  </g>

  <!-- Subtitle with Hanzi & Cyberpunk Tags -->
  <g transform="translate(500, 160)">
    <text x="0" y="0" class="chinese mono" font-size="15" fill="#00f0ff" text-anchor="middle" letter-spacing="2" filter="url(#glow-cyan)">
      「 赛博网络架构师 」 FULL-STACK NETRUNNER • CREATOR OF TABISVPN
    </text>
    <text x="0" y="22" class="mono" font-size="12" fill="#d0d5e2" text-anchor="middle" letter-spacing="3" opacity="0.85">
      KOTLIN COMPOSE // FASTAPI // GO XRAY // C HEV // TAILWIND
    </text>
  </g>

  <!-- Central Laser Divider Line -->
  <line x1="160" y1="198" x2="840" y2="198" stroke="url(#laser-line)" stroke-width="2"/>

  <!-- Futuristic Bottom Telemetry & Status Badges -->
  <g transform="translate(500, 235)">
    <!-- Telemetry status nodes -->
    <text x="-320" y="0" class="mono" font-size="11" fill="#00ff9f" font-weight="600" text-anchor="middle">
      <tspan fill="#00ff9f">●</tspan> 核心状态: ONLINE
    </text>
    <text x="-160" y="0" class="mono" font-size="11" fill="#00f0ff" font-weight="600" text-anchor="middle">
      ◈ 隐秘隧道: VLESS / REALITY
    </text>
    <text x="20" y="0" class="mono" font-size="11" fill="#ff00aa" font-weight="600" text-anchor="middle">
      ▲ 高速传输: HYSTERIA_2 (QUIC)
    </text>
    <text x="200" y="0" class="mono" font-size="11" fill="#ffb700" font-weight="600" text-anchor="middle">
      ■ 底层穿透: HEV TUN2SOCKS
    </text>
    <text x="335" y="0" class="mono" font-size="11" fill="#00ff9f" font-weight="600" text-anchor="middle">
      ◆ 追踪状态: UNTRACEABLE
    </text>
  </g>
</svg>
