<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <style>
      @keyframes glitch-anim-1 {
        0%, 100% { transform: translate(0, 0); }
        12% { transform: translate(-3px, 1px); }
        14% { transform: translate(5px, -2px); }
        16% { transform: translate(0, 0); }
        42% { transform: translate(6px, 2px); }
        44% { transform: translate(-4px, -1px); }
        46% { transform: translate(0, 0); }
        68% { transform: translate(-5px, -2px); }
        70% { transform: translate(3px, 1px); }
        72% { transform: translate(0, 0); }
        92% { transform: translate(4px, -1px); }
        94% { transform: translate(0, 0); }
      }

      @keyframes glitch-anim-2 {
        0%, 100% { opacity: 0; transform: translate(0, 0); }
        12% { opacity: 0.9; transform: translate(4px, -2px); }
        14% { opacity: 0.8; transform: translate(-6px, 1px); }
        16% { opacity: 0; transform: translate(0, 0); }
        42% { opacity: 0.85; transform: translate(-5px, -1px); }
        44% { opacity: 0.9; transform: translate(5px, 2px); }
        46% { opacity: 0; transform: translate(0, 0); }
        68% { opacity: 0.9; transform: translate(5px, 2px); }
        70% { opacity: 0.8; transform: translate(-3px, -1px); }
        72% { opacity: 0; transform: translate(0, 0); }
      }

      @keyframes glitch-slice-1 {
        0%, 100% { opacity: 0; transform: scaleX(0); }
        12% { opacity: 0.9; transform: scaleX(1); }
        16% { opacity: 0; transform: scaleX(0); }
        42% { opacity: 0.95; transform: scaleX(1); }
        46% { opacity: 0; transform: scaleX(0); }
        68% { opacity: 0.85; transform: scaleX(1); }
        72% { opacity: 0; transform: scaleX(0); }
      }

      @keyframes glitch-slice-2 {
        0%, 100% { opacity: 0; }
        13% { opacity: 0.8; transform: translate(8px, 0); }
        15% { opacity: 0; }
        43% { opacity: 0.9; transform: translate(-10px, 0); }
        45% { opacity: 0; }
      }

      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .kanji { font-family: 'Noto Sans SC', 'SimHei', 'Microsoft YaHei', sans-serif; font-weight: 900; }
      .title-font { font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; letter-spacing: 9px; text-transform: uppercase; }
      .glitch-1 { animation: glitch-anim-1 3.2s infinite ease-in-out; }
      .glitch-2 { animation: glitch-anim-2 3.2s infinite ease-in-out; }
      .slice-bar-1 { animation: glitch-slice-1 3.2s infinite; transform-origin: left; }
      .slice-bar-2 { animation: glitch-slice-2 3.2s infinite; }
      .blink { animation: cursor-blink 0.8s infinite; }
    </style>

    <!-- Clip paths for glitch slice cuts -->
    <clipPath id="cut-top">
      <rect x="0" y="0" width="960" height="118"/>
    </clipPath>
    <clipPath id="cut-mid">
      <rect x="0" y="105" width="960" height="30"/>
    </clipPath>
    <clipPath id="cut-bottom">
      <rect x="0" y="130" width="960" height="120"/>
    </clipPath>

    <!-- High-res dot grid pattern -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.15"/>
    </pattern>

    <!-- Fine horizontal scanline pattern -->
    <pattern id="scanlines" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="250" fill="#070707"/>
  <rect width="960" height="250" fill="url(#dot-grid)"/>
  <rect width="960" height="250" fill="url(#scanlines)"/>

  <!-- Brutalist Outer Frames -->
  <rect x="14" y="14" width="932" height="222" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.85"/>
  <rect x="19" y="19" width="922" height="212" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Heavy Corner Blocks -->
  <rect x="14" y="14" width="16" height="4" fill="#ffffff"/>
  <rect x="14" y="14" width="4" height="16" fill="#ffffff"/>
  <rect x="930" y="14" width="16" height="4" fill="#ffffff"/>
  <rect x="942" y="14" width="4" height="16" fill="#ffffff"/>
  <rect x="14" y="232" width="16" height="4" fill="#ffffff"/>
  <rect x="14" y="220" width="4" height="16" fill="#ffffff"/>
  <rect x="930" y="232" width="16" height="4" fill="#ffffff"/>
  <rect x="942" y="220" width="4" height="16" fill="#ffffff"/>

  <!-- Top Brutalist Header Line -->
  <line x1="14" y1="42" x2="946" y2="42" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="35" y="22" width="8" height="8" fill="#ffffff"/>
  <text x="50" y="32" class="mono" font-size="11" fill="#ffffff" letter-spacing="2" font-weight="700">
    SYSTEM_SPEC // 0x73F7 // ALIAS: @nikolaevsaryal10-byte
  </text>
  <text x="925" y="32" text-anchor="end" class="mono kanji" font-size="11" fill="#ffffff" letter-spacing="2" opacity="0.8">
    「 幽灵协议 」 SEC_LEVEL: 9 // STATUS: OPERATIONAL
  </text>

  <!-- Left Brutalist Inverted Stamps -->
  <g transform="translate(45, 66)">
    <!-- White Box, Black Text -->
    <rect x="0" y="0" width="36" height="36" fill="#ffffff"/>
    <text x="18" y="25" class="kanji" font-size="20" fill="#000000" text-anchor="middle">幽</text>

    <!-- Black Box with White Outline -->
    <rect x="0" y="44" width="36" height="36" fill="#070707" stroke="#ffffff" stroke-width="1.5"/>
    <text x="18" y="69" class="kanji" font-size="20" fill="#ffffff" text-anchor="middle">灵</text>

    <!-- Small Coordinate Stamp -->
    <text x="18" y="104" class="mono" font-size="9" fill="#888888" text-anchor="middle" letter-spacing="1">0x01</text>
  </g>

  <!-- Right Brutalist Inverted Stamps -->
  <g transform="translate(879, 66)">
    <!-- Black Box with White Outline -->
    <rect x="0" y="0" width="36" height="36" fill="#070707" stroke="#ffffff" stroke-width="1.5"/>
    <text x="18" y="25" class="kanji" font-size="20" fill="#ffffff" text-anchor="middle">隐</text>

    <!-- White Box, Black Text -->
    <rect x="0" y="44" width="36" height="36" fill="#ffffff"/>
    <text x="18" y="69" class="kanji" font-size="20" fill="#000000" text-anchor="middle">秘</text>

    <!-- Small Coordinate Stamp -->
    <text x="18" y="104" class="mono" font-size="9" fill="#888888" text-anchor="middle" letter-spacing="1">0xFF</text>
  </g>

  <!-- Center Glitch Typography -->
  <g transform="translate(480, 126)">
    <!-- Base Sharp White Text -->
    <text x="0" y="0" class="title-font" font-size="62" fill="#ffffff" text-anchor="middle">ALTZGAMERZ</text>

    <!-- Animated Glitch Layer 1 (Mid/Top Slice Displaced) -->
    <g class="glitch-1" clip-path="url(#cut-top)">
      <text x="0" y="0" class="title-font" font-size="62" fill="#e0e0e0" text-anchor="middle" opacity="0.95">ALTZGAMERZ</text>
    </g>

    <!-- Animated Glitch Layer 2 (Bottom Slice Displaced) -->
    <g class="glitch-2" clip-path="url(#cut-bottom)">
      <text x="0" y="0" class="title-font" font-size="62" fill="#ffffff" text-anchor="middle">ALTZGAMERZ</text>
    </g>

    <!-- Animated Cut Mid Slice (Jitters Horizontally) -->
    <g class="slice-bar-2" clip-path="url(#cut-mid)">
      <text x="0" y="0" class="title-font" font-size="62" fill="#ffffff" text-anchor="middle">ALTZGAMERZ</text>
    </g>
  </g>

  <!-- Horizontal Glitch Bars Cutting Across -->
  <rect x="220" y="112" width="520" height="2" fill="#ffffff" class="slice-bar-1"/>
  <rect x="310" y="132" width="340" height="3" fill="#ffffff" class="slice-bar-1"/>
  <rect x="420" y="98" width="180" height="1.5" fill="#ffffff" class="slice-bar-1"/>

  <!-- Subtitle Line with Kanji & Clean Technical Hierarchy -->
  <g transform="translate(480, 168)">
    <text x="0" y="0" class="mono kanji" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="3" font-weight="700">
      FULL-STACK &amp; SYSTEMS ARCHITECT // TABISVPN ARCHITECT // 「 极客 」
    </text>
    <text x="0" y="19" class="mono" font-size="11" fill="#888888" text-anchor="middle" letter-spacing="3">
      KOTLIN COMPOSE • FASTAPI • GO XRAY • C HEV • TAILWIND
    </text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="14" y1="205" x2="946" y2="205" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(480, 224)">
    <text x="-430" y="0" class="mono" font-size="10" fill="#ffffff" font-weight="700">
      [ CORE: ACTIVE ]
    </text>
    <text x="-270" y="0" class="mono kanji" font-size="10" fill="#cccccc">
      [ 协议: VLESS / HYSTERIA_2 ]
    </text>
    <text x="-40" y="0" class="mono" font-size="10" fill="#ffffff">
      [ TUNNEL: HEV SOCKS5 ]
    </text>
    <text x="170" y="0" class="mono kanji" font-size="10" fill="#cccccc">
      [ 状态: 隐秘穿透 ]
    </text>
    <text x="360" y="0" class="mono" font-size="10" fill="#ffffff" font-weight="700">
      UNRESTRICTED<tspan class="blink">_</tspan>
    </text>
  </g>
</svg>
